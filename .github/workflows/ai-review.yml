name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run OpenCode AI Review
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest on 2026-08-11
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "permission": {
                "external_directory": "deny"
              },
              "provider": {
                "llamacpp": {
                  "options": {
                    "baseURL": "{env:OPENAI_BASE_URL}",
                    "apiKey": "{env:OPENAI_API_KEY}"
                  }
                }
              }
            }
          AI_REVIEW_FINDINGS_FILE: ${{ github.workspace }}/.git/ai-review-findings.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: llamacpp/unsloth/Qwen3.6-27B-UD-Q4_K_XL
          use_github_token: true
          prompt: |
            Review this pull request thoroughly. Start your response with "## AI Review".
            First list every changed file in the pull request. Review each changed file in a separate subagent.
            Invoke the subagents synchronously, one file at a time, and wait for each subagent to finish before calling the next.
            Do not run file-review subagents in parallel or combine multiple files in one subagent.
            After all file reviews are complete, synthesize their findings into the final pull request review.
            Write the actionable findings for inline code comments with the write tool to the exact path `.git/ai-review-findings.json` in the repository checkout. This path is intentional temporary runner metadata; do not use `/tmp`, shell variables, or any path outside the checkout.
            The file must contain valid JSON with exactly this shape: {"findings":[{"path":"relative/path","line":123,"side":"RIGHT","body":"Explain the issue and the recommended fix."}]}.
            Use one finding per comment. The path must be relative to the repository root, and line must be a line present in the pull request diff. Use RIGHT for additions or context lines and LEFT for deletions. Omit findings that cannot be anchored to a diff line.
            If there are no actionable findings, write {"findings":[]} instead. Do not write this file in a tracked repository path, do not wrap it in Markdown fences, and keep the final response concise because the detailed findings will be posted as inline review comments.
            - Check for code quality issues
            - Look for potential bugs
            - Identify security concerns
            - Check for performance issues
            - Suggest improvements

      - name: Publish inline AI review comments
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FINDINGS_FILE: ${{ github.workspace }}/.git/ai-review-findings.json
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const findingsFile = process.env.FINDINGS_FILE;

            if (!fs.existsSync(findingsFile)) {
              core.warning(`OpenCode did not create ${findingsFile}; no inline comments were published.`);
              return;
            }

            let review;
            try {
              review = JSON.parse(fs.readFileSync(findingsFile, "utf8"));
            } catch (error) {
              throw new Error(`Could not parse AI review findings: ${error.message}`);
            }

            if (!review || !Array.isArray(review.findings)) {
              throw new Error("AI review findings must contain a findings array.");
            }

            if (review.findings.length === 0) {
              core.info("OpenCode reported no actionable findings.");
              return;
            }

            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const commitId = context.payload.pull_request.head.sha;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            function diffLines(patch) {
              const lines = { LEFT: new Set(), RIGHT: new Set() };
              let oldLine;
              let newLine;

              for (const patchLine of patch.split("\n")) {
                const hunk = patchLine.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (hunk) {
                  oldLine = Number(hunk[1]);
                  newLine = Number(hunk[2]);
                  continue;
                }

                if (oldLine === undefined || patchLine.startsWith("\\")) continue;

                if (patchLine.startsWith("+")) {
                  lines.RIGHT.add(newLine++);
                } else if (patchLine.startsWith("-")) {
                  lines.LEFT.add(oldLine++);
                } else if (patchLine.startsWith(" ")) {
                  lines.LEFT.add(oldLine++);
                  lines.RIGHT.add(newLine++);
                }
              }

              return lines;
            }

            const existingComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const existingKeys = new Set(
              existingComments
                .filter((comment) => comment.body?.startsWith("<!-- ai-review -->"))
                .map((comment) => `${comment.path}:${comment.line}:${comment.side}:${comment.body}`),
            );

            const comments = [];
            const maxCommentBytes = 60000;
            let skipped = 0;

            for (const finding of review.findings) {
              if (
                !finding ||
                typeof finding.path !== "string" ||
                !Number.isInteger(finding.line) ||
                !["LEFT", "RIGHT"].includes(finding.side) ||
                typeof finding.body !== "string" ||
                finding.body.trim().length === 0
              ) {
                skipped++;
                continue;
              }

              const file = files.find((candidate) => candidate.filename === finding.path);
              if (!file?.patch) {
                skipped++;
                continue;
              }

              if (!diffLines(file.patch)[finding.side].has(finding.line)) {
                skipped++;
                continue;
              }

              const body = `<!-- ai-review -->\n${finding.body.trim()}`;
              if (Buffer.byteLength(body, "utf8") > maxCommentBytes) {
                skipped++;
                continue;
              }

              const key = `${finding.path}:${finding.line}:${finding.side}:${body}`;
              if (existingKeys.has(key)) continue;
              existingKeys.add(key);

              comments.push({
                path: finding.path,
                line: finding.line,
                side: finding.side,
                body,
              });
            }

            for (let index = 0; index < comments.length; index += 100) {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: pullNumber,
                commit_id: commitId,
                body: index === 0
                  ? "## AI Review\nDetailed findings are attached to the changed lines."
                  : "Additional AI review findings are attached to the changed lines.",
                event: "COMMENT",
                comments: comments.slice(index, index + 100),
              });
            }

            core.info(`Published ${comments.length} inline AI review comment(s).`);
            if (skipped > 0) core.warning(`Skipped ${skipped} finding(s) that could not be anchored to the PR diff.`);
