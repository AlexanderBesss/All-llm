name: AI Review

on:
  pull_request:
    types: [labeled]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.label.name == 'ai-review' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Count AI review files
        id: inventory
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            core.setOutput("file_count", String(files.length));
            core.info(`AI review progress: 0/${files.length} files processed; review starting.`);

      - name: Run OpenCode AI Review
        id: opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENCODE_LOG_LEVEL: WARN
          OPENCODE_CONFIG_CONTENT: |
            {
              "permission": {
                "external_directory": "deny"
              },
              "provider": {
                "llamacpp": {
                  "options": {
                    "baseURL": "{env:OPENAI_BASE_URL}",
                    "apiKey": "{env:OPENAI_API_KEY}"
                  }
                }
              }
            }
          AI_REVIEW_FINDINGS_FILE: ${{ github.workspace }}/.git/ai-review-findings.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: llamacpp/unsloth/Qwen3.8-27B-UD-Q5_K_XL
          variant: medium
          use_github_token: true
          prompt: |
            Review this pull request for high-relevance, high-impact defects only. Start your response with "## AI Review".
            First obtain the complete changed-file inventory in the pull request's existing changed-file order; do not sort or reorder it. For every changed file, inspect its complete contents at the pull-request revision.
            Review the entire changed-file inventory as one coherent unit in this same context. Inspect all and only the changed files together, in the existing pull-request order, and do not split the review into per-file, size-limited, or parallel subagent contexts. Do not use the Task tool or invoke review subagents. Treat the complete inventory as one review context, so findings can account for interactions and contracts across files. Keep progress output concise: after obtaining the inventory, report `AI review progress: 0/<file-count> files processed; one review context queued.`; immediately before reviewing, report `AI review progress: 0/<file-count> files processing (single review context).`; after reviewing, report `AI review progress: <file-count>/<file-count> files processed (single review context complete).`. Emit no file inventory, command trace, permission evaluation, or other verbose progress output.
            Do not include the changed-file inventory or any redundant file list in the response.
            Write the actionable findings for inline code comments with the write tool to the exact path `.git/ai-review-findings.json` in the repository checkout. This path is intentional temporary runner metadata; do not use `/tmp`, shell variables, or any path outside the checkout.
            The file must contain valid JSON with exactly this shape: {"findings":[{"path":"relative/path","line":123,"side":"RIGHT","relevance":"high","confidence":0.93,"severity":"high","body":"Explain the concrete defect, its impact, and the recommended fix."}]}.
            Use one finding per comment. The path must be relative to the repository root, and line must be a line present in the pull request diff. Use RIGHT for additions or context lines and LEFT for deletions. Omit findings that cannot be anchored to a diff line.
            Only report a finding when it is directly caused by this pull request, has a concrete and actionable correctness, security, data-loss, reliability, or severe-performance impact, and you have at least 0.85 confidence. Set relevance to "high", confidence to a number from 0 to 1, and severity to "high" or "critical". Never report style preferences, naming suggestions, formatting, documentation polish, speculative concerns, or issues already handled elsewhere in the diff.
            Few-shot calibration examples:
            - COMMENT: A new authorization branch accepts an expired token and reaches a protected operation. This is directly introduced, reproducible from the diff, high impact, and confidence 0.96, so emit one anchored finding with relevance "high" and severity "critical".
            - SKIP: A variable could be renamed for clarity but behavior is unchanged. This is a style preference, so emit no finding.
            - SKIP: A cache might be slower under an unmeasured workload, with no demonstrated regression or fix. This is speculative and below the relevance threshold, so emit no finding.
            If there are no high-relevance findings, write {"findings":[]} instead. Do not write this file in a tracked repository path, do not wrap it in Markdown fences, and keep the final response concise because the detailed findings will be posted as inline review comments.

      - name: Report AI review file count
        if: always()
        uses: actions/github-script@v7
        env:
          REVIEW_FILE_COUNT: ${{ steps.inventory.outputs.file_count }}
          REVIEW_STATUS: ${{ steps.opencode.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fileCount = process.env.REVIEW_FILE_COUNT;
            if (!fileCount) {
              core.warning("AI review file count was unavailable.");
              return;
            }
            if (process.env.REVIEW_STATUS === "success") {
              core.info(`AI review progress: ${fileCount}/${fileCount} files processed.`);
            } else {
              core.warning(`AI review progress: ${fileCount} files queued; review ${process.env.REVIEW_STATUS || "did not complete"}.`);
            }

      - name: Publish inline AI review comments
        id: publish
        uses: actions/github-script@v7
        env:
          FINDINGS_FILE: ${{ github.workspace }}/.git/ai-review-findings.json
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const findingsFile = process.env.FINDINGS_FILE;
            core.setOutput("published_findings", "0");
            core.setOutput("review_complete", "false");

            if (!fs.existsSync(findingsFile)) {
              core.warning(`OpenCode did not create ${findingsFile}; no inline comments were published.`);
              return;
            }

            let review;
            try {
              review = JSON.parse(fs.readFileSync(findingsFile, "utf8"));
            } catch (error) {
              throw new Error(`Could not parse AI review findings: ${error.message}`);
            }

            if (!review || !Array.isArray(review.findings)) {
              throw new Error("AI review findings must contain a findings array.");
            }

            if (review.findings.length === 0) {
              core.info("OpenCode reported no actionable findings.");
              core.setOutput("review_complete", "true");
              return;
            }

            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const commitId = context.payload.pull_request.head.sha;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            function diffLines(patch) {
              const lines = { LEFT: new Set(), RIGHT: new Set() };
              let oldLine;
              let newLine;

              for (const patchLine of patch.split("\n")) {
                const hunk = patchLine.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (hunk) {
                  oldLine = Number(hunk[1]);
                  newLine = Number(hunk[2]);
                  continue;
                }

                if (oldLine === undefined || patchLine.startsWith("\\")) continue;

                if (patchLine.startsWith("+")) {
                  lines.RIGHT.add(newLine++);
                } else if (patchLine.startsWith("-")) {
                  lines.LEFT.add(oldLine++);
                } else if (patchLine.startsWith(" ")) {
                  lines.LEFT.add(oldLine++);
                  lines.RIGHT.add(newLine++);
                }
              }

              return lines;
            }

            const existingComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const existingKeys = new Set(
              existingComments
                .filter((comment) => comment.body?.startsWith("<!-- ai-review -->"))
                .map((comment) => `${comment.path}:${comment.line}:${comment.side}:${comment.body}`),
            );

            const comments = [];
            const maxCommentBytes = 60000;
            const minimumConfidence = 0.85;
            let skipped = 0;

            for (const finding of review.findings) {
              if (
                !finding ||
                typeof finding.path !== "string" ||
                !Number.isInteger(finding.line) ||
                finding.line <= 0 ||
                !["LEFT", "RIGHT"].includes(finding.side) ||
                finding.relevance !== "high" ||
                !Number.isFinite(finding.confidence) ||
                finding.confidence < minimumConfidence ||
                finding.confidence > 1 ||
                !["high", "critical"].includes(finding.severity) ||
                typeof finding.body !== "string" ||
                finding.body.trim().length === 0
              ) {
                skipped++;
                continue;
              }

              const file = files.find((candidate) => candidate.filename === finding.path);
              if (!file?.patch) {
                skipped++;
                continue;
              }

              if (!diffLines(file.patch)[finding.side].has(finding.line)) {
                skipped++;
                continue;
              }

              const body = `<!-- ai-review -->\n${finding.body.trim()}`;
              if (Buffer.byteLength(body, "utf8") > maxCommentBytes) {
                skipped++;
                continue;
              }

              const key = `${finding.path}:${finding.line}:${finding.side}:${body}`;
              if (existingKeys.has(key)) continue;
              existingKeys.add(key);

              comments.push({
                path: finding.path,
                line: finding.line,
                side: finding.side,
                body,
              });
            }

            for (let index = 0; index < comments.length; index += 100) {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: pullNumber,
                commit_id: commitId,
                body: index === 0
                  ? `## AI Review\n\n**Findings (${comments.length} high-severity):**\n\nDetailed findings are attached to the changed lines.`
                  : "Additional AI review findings are attached to the changed lines.",
                event: "COMMENT",
                comments: comments.slice(index, index + 100),
              });
            }

            core.info(`Published ${comments.length} inline AI review comment(s).`);
            if (skipped > 0) core.warning(`Skipped ${skipped} finding(s) that could not be anchored to the PR diff.`);
            core.setOutput("published_findings", String(comments.length));
            core.setOutput("review_complete", "true");

      - name: Advance AI review labels
        if: success() && steps.publish.outputs.review_complete == 'true'
        uses: actions/github-script@v7
        env:
          PUBLISHED_FINDINGS: ${{ steps.publish.outputs.published_findings }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pullNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const publishedFindings = Number(process.env.PUBLISHED_FINDINGS || "0");

            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pullNumber, name: "ai-review" });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            core.info(`Cleared the ai-review trigger label from pull request #${pullNumber}; published ${publishedFindings} high-severity finding(s). A human must apply ai-fix to request repair.`);
