name: Build WhisperNote

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
    paths:
      - whisper-note/**
      - .github/workflows/build.yml
  pull_request:
    branches: [main, master]
    paths:
      - whisper-note/**
      - .github/workflows/build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore whisper-note/WhisperNote.csproj

      - name: Publish Release
        run: |
          dotnet publish whisper-note/WhisperNote.csproj `
            -c Release `
            -r win-x64 `
            -o whisper-note/publish `
            /p:PublishSingleFile=true `
            /p:SelfContained=false

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive `
            -Path whisper-note/publish/* `
            -DestinationPath artifacts/WhisperNote-win-x64.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperNote-win-x64
          path: artifacts/WhisperNote-win-x64.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: WhisperNote-win-x64
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/WhisperNote-win-x64.zip \
            --verify-tag \
            --title "WhisperNote $GITHUB_REF_NAME" \
            --generate-notes
