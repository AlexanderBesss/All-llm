name: Build WhisperNote

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
    paths:
      - whisper-note/**
      - .github/workflows/build.yml
  pull_request:
    branches: [main, master]
    paths:
      - whisper-note/**
      - .github/workflows/build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore whisper-note/tests/WhisperNote.Tests.csproj

      - name: Build
        run: dotnet build whisper-note/WhisperNote.csproj -c Release --no-restore

      - name: Test
        run: dotnet test whisper-note/tests/WhisperNote.Tests.csproj -c Release --no-restore

      - name: Publish Release
        run: |
          dotnet publish whisper-note/WhisperNote.csproj `
            -c Release `
            -r win-x64 `
            -o whisper-note/publish `
            /p:PublishSingleFile=true `
            /p:SelfContained=false

      - name: Package release assets
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        shell: pwsh
        run: |
          $publishDir = Join-Path $PWD "whisper-note/publish"
          $publishExecutable = Join-Path $publishDir "WhisperNote.exe"
          if (-not (Test-Path -LiteralPath $publishExecutable -PathType Leaf)) {
            throw "Required publish executable is missing: $publishExecutable"
          }

          $artifactsDir = Join-Path $PWD "artifacts"
          New-Item -ItemType Directory -Path $artifactsDir -Force | Out-Null

          $zipPath = Join-Path $artifactsDir "WhisperNote-win-x64.zip"
          Compress-Archive `
            -Path (Join-Path $publishDir "*") `
            -DestinationPath $zipPath `
            -Force

          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Required release ZIP is missing: $zipPath"
          }

          $standaloneExecutable = Join-Path $artifactsDir "WhisperNote.exe"
          Copy-Item -LiteralPath $publishExecutable -Destination $standaloneExecutable -Force
          if (-not (Test-Path -LiteralPath $standaloneExecutable -PathType Leaf)) {
            throw "Required standalone executable is missing: $standaloneExecutable"
          }

          $validationDir = Join-Path $env:RUNNER_TEMP "WhisperNote-release-validation"
          New-Item -ItemType Directory -Path $validationDir -Force | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $validationDir -Force

          $archivedExecutable = Join-Path $validationDir "WhisperNote.exe"
          if (-not (Test-Path -LiteralPath $archivedExecutable -PathType Leaf)) {
            throw "The release ZIP does not contain WhisperNote.exe"
          }

          $publishedHash = (Get-FileHash -LiteralPath $publishExecutable -Algorithm SHA256).Hash
          $standaloneHash = (Get-FileHash -LiteralPath $standaloneExecutable -Algorithm SHA256).Hash
          $archivedHash = (Get-FileHash -LiteralPath $archivedExecutable -Algorithm SHA256).Hash
          if ($publishedHash -ne $standaloneHash -or $publishedHash -ne $archivedHash) {
            throw "WhisperNote.exe checksums differ between publish output, standalone asset, and ZIP"
          }

          Write-Host "Validated WhisperNote.exe SHA256: $publishedHash"

      - name: Upload release assets
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WhisperNote-release-assets
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WhisperNote
          path: whisper-note/publish/
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: WhisperNote-release-assets
          path: artifacts

      - name: Verify release assets
        run: |
          test -f artifacts/WhisperNote-win-x64.zip
          test -f artifacts/WhisperNote.exe

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/WhisperNote-win-x64.zip \
            artifacts/WhisperNote.exe \
            --verify-tag \
            --title "WhisperNote $GITHUB_REF_NAME" \
            --generate-notes
