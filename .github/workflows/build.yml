name: Build WhisperNote

on:
  push:
    branches: [main, master]
    paths:
      - whisper-note/**
      - .github/workflows/build.yml
  pull_request:
    branches: [main, master]
    paths:
      - whisper-note/**
      - .github/workflows/build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore whisper-note/WhisperNote.csproj

      - name: Build
        run: dotnet build whisper-note/WhisperNote.csproj -c Release --no-restore

      - name: Test
        run: dotnet test whisper-note/tests/WhisperNote.Tests.csproj -c Release --no-restore

      - name: Publish Release
        run: |
          dotnet publish whisper-note/WhisperNote.csproj `
            -c Release `
            -r win-x64 `
            -o whisper-note/publish `
            /p:PublishSingleFile=true `
            /p:SelfContained=false

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WhisperNote
          path: whisper-note/publish/
          if-no-files-found: error
          retention-days: 30
